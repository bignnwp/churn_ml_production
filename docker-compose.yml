services:
  churn-ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-ml-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ml-monitoring:
    profiles: ["monitoring"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-ml-monitoring
    command:
      - python
      - scripts/practical_assignment.py
      - --metrics-port
      - "8001"
      - --serve-forever
    ports:
      - "8001:8001"
    volumes:
      - ./data/raw:/app/data/raw
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.13.5
    container_name: churn-ml-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/rules/prometheus_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      ml-monitoring:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
