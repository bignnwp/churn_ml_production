global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ml-monitoring-assignment
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-monitoring:8001"]

  - job_name: churn-ml-api
    metrics_path: /metrics
    static_configs:
      - targets: ["churn-ml-api:8000"]
