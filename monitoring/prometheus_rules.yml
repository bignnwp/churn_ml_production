# Пример правил алертинга для ML-мониторинга
# Подключается к Prometheus как rule_files.

groups:
  - name: ml_monitoring
    rules:
      - alert: HighDataDrift
        expr: model_drift_share > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High data drift detected"
          description: "Share of drifted features is {{ $value }} (threshold 0.25)."

      - alert: LowF1Score
        expr: model_f1_score < 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Model F1 below threshold"
          description: "Current F1={{ $value }}."

      - alert: FairnessDIOutOfRange
        expr: model_fairness_di < 0.8 or model_fairness_di > 1.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disparate Impact outside common band"
          description: "DI={{ $value }}. Проверьте правовой базис анализа (152-ФЗ)."
