# Deterministic tests for the production alert rules.
# Run with: promtool test rules monitoring/prometheus_rule_tests.yml
rule_files:
  - prometheus_rules.yml

evaluation_interval: 15s

tests:
  - name: quality-drift-fairness-alerts-fire
    interval: 15s
    input_series:
      - series: model_f1_score
        values: '0.4+0x24'
      - series: model_drift_share
        values: '0.3+0x24'
      - series: model_label_positive_rate_delta
        values: '0.1+0x24'
      - series: model_fairness_di
        values: '0.7+0x24'
      - series: 'up{job="ml-monitoring-assignment",instance="ml-monitoring:8001"}'
        values: '0+0x24'
    alert_rule_test:
      - eval_time: 3m
        alertname: LowModelF1
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Model F1 score is below the configured threshold
              description: Current F1=0.4; expected F1 >= 0.50. Check the model and recent labeled data.
      - eval_time: 3m
        alertname: HighDataDrift
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: High data drift detected
              description: Share of drifted columns is 0.3 (threshold 0.25). Review the Evidently report.
      - eval_time: 3m
        alertname: TargetDistributionShift
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Target positive-class share changed
              description: Current minus reference positive-class share is 0.1.
      - eval_time: 3m
        alertname: LowFairnessDisparateImpact
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Disparate Impact ratio is below the review threshold
              description: DI=0.7. Investigate group-level outcomes; this ratio is a screening signal, not a legal conclusion.
      - eval_time: 6m
        alertname: MonitoringExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ml-monitoring-assignment
              instance: ml-monitoring:8001
            exp_annotations:
              summary: ML monitoring exporter is unreachable
              description: Prometheus cannot scrape ml-monitoring:8001/metrics.

  - name: missing-f1-metric-alert-fires
    interval: 15s
    input_series:
      - series: 'up{job="ml-monitoring-assignment",instance="ml-monitoring:8001"}'
        values: '1+0x28'
    alert_rule_test:
      - eval_time: 6m
        alertname: ModelF1MetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Model F1 metric is missing
              description: The practical-assignment exporter is not exposing model_f1_score.
