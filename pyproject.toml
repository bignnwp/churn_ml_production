[tool.poetry]
name = "churn-ml-production"
version = "0.1.0"
description = "Production-oriented customer churn ML project"
authors = ["Team First"]
readme = "README.md"
packages = [{include = "churn_ml", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^2.0"
pandas = "^2.2"
scikit-learn = ">=1.5.0,<1.6.0"
scipy = "^1.14"
imbalanced-learn = "^0.13"
joblib = "^1.4"
matplotlib = "^3.9"
seaborn = "^0.13"
tqdm = "^4.66"
phik = "^0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.6"
mypy = "^1.11"
pre-commit = "^3.8"
types-seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
