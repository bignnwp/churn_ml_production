apiVersion: v1
kind: Service
metadata:
  name: churn-ml-api
  labels:
    app: churn-ml-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: churn-ml-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
