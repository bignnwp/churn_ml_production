# Опционально: для Prometheus Operator (kube-prometheus-stack)
# kubectl apply -f k8s/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: churn-ml-api
  labels:
    app: churn-ml-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: churn-ml-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
