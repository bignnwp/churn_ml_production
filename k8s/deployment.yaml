apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-ml-api
  labels:
    app: churn-ml-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: churn-ml-api
  template:
    metadata:
      labels:
        app: churn-ml-api
    spec:
      containers:
        - name: api
          image: churn-ml-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
