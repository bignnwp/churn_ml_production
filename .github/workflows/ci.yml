name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: MyPy
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus_rules.yml:/etc/prometheus/rules/prometheus_rules.yml:ro" \
            --entrypoint=/bin/promtool \
            prom/prometheus:v3.13.5 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro" \
            --entrypoint=/bin/promtool \
            prom/prometheus:v3.13.5 \
            check rules /etc/prometheus/prometheus_rules.yml

      - name: Test Prometheus alert firing behavior
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus/rules:ro" \
            --entrypoint=/bin/promtool \
            prom/prometheus:v3.13.5 \
            test rules /etc/prometheus/rules/prometheus_rule_tests.yml

      - name: Build image
        run: docker build -t churn-ml-api:latest .

      - name: Smoke test API container
        run: |
          docker run -d --name churn-ml-api-smoke -p 8000:8000 churn-ml-api:latest
          trap 'docker rm -f churn-ml-api-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "API did not become ready"
            docker logs churn-ml-api-smoke
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8000/live \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data.get("status") == "alive", data
          '

          curl --fail --silent http://127.0.0.1:8000/ready \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert data.get("status") == "ready", data
          assert data.get("model_loaded") == "true", data
          '

          prediction=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            --data-binary '{
              "Age": 42.0,
              "NumOfProducts": 2,
              "Balance": 100000.0,
              "EstimatedSalary": 100000.0,
              "IsActiveMember": 1,
              "Geography": "Germany",
              "Gender": "Male"
            }')

          printf '%s' "$prediction" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          assert type(data.get("prediction")) is int, data
          assert data["prediction"] in (0, 1), data
          probability = data.get("probability")
          assert isinstance(probability, (int, float)), data
          assert 0.0 <= probability <= 1.0, data
          print("Prediction response:", data)
          '

          curl --fail --silent --show-error http://127.0.0.1:8000/metrics \
            | grep -Eq '^churn_predict_total\{outcome="[01]"\} [1-9][0-9]*(\.[0-9]+)?$'

          echo "API smoke test passed: liveness, readiness, inference and metrics"
